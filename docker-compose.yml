version: "3.9"

services:
  # ─── Expo / React Native development server ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trashtruck_app
    ports:
      - "19000:19000"   # Expo DevTools / tunnel
      - "19001:19001"   # Metro bundler
      - "19002:19002"   # Expo web UI / inspector
    volumes:
      # Mount source so edits are reflected immediately (hot reload)
      - .:/app
      # Keep the container's node_modules to avoid host/container conflicts
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    env_file:
      - path: .env
        required: false
    depends_on:
      - firebase-emulators
    networks:
      - trashtruck_net
    stdin_open: true
    tty: true

  # ─── Firebase Emulators (Auth, Firestore, Functions, Hosting, UI) ─────────
  firebase-emulators:
    image: node:18-alpine
    container_name: trashtruck_firebase
    working_dir: /app
    command: >
      sh -c "npm install -g firebase-tools &&
             npm install --prefix functions &&
             firebase emulators:start --project demo-trashtruck"
    ports:
      - "4000:4000"   # Emulator Suite UI
      - "5000:5000"   # Hosting emulator
      - "5001:5001"   # Cloud Functions emulator
      - "8080:8080"   # Firestore emulator
      - "9099:9099"   # Authentication emulator
    volumes:
      - .:/app
      - /app/node_modules
      - /app/functions/node_modules
    environment:
      - FIREBASE_AUTH_EMULATOR_HOST=localhost:9099
      - FIRESTORE_EMULATOR_HOST=localhost:8080
    networks:
      - trashtruck_net

networks:
  trashtruck_net:
    driver: bridge
